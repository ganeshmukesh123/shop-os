appId: in.shopos.desktop
productName: Shop OS
directories:
  output: release
files:
  - out/**
  - package.json
# Generated SQL migrations are read from disk at startup (see src/main/app/appConfig.ts).
extraResources:
  - from: drizzle
    to: drizzle
# better-sqlite3 is a native module: it must be rebuilt for Electron and live outside the asar.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
npmRebuild: true
# Fuses are flipped on the packaged binary only; node_modules/electron stays as is so `pnpm test`
# can still run Vitest with ELECTRON_RUN_AS_NODE (spec 018 FR-004, FR-005). `pnpm check:fuses`
# reads the result. ASAR integrity covers macOS and Windows; the Linux AppImage and the files
# outside the archive (drizzle migrations, better-sqlite3) are accepted gaps (decisions D3, D4).
# grantFileProtocolExtraPrivileges stays on while the screen loads from file:// (off in PR C).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.business
  target: [dmg]
  # No Apple developer account: sign ad hoc ("-") so the whole bundle has one consistent signature.
  # With `identity: null` the bundle is left half-signed (codesign --verify fails) and a downloaded
  # copy can be reported as "damaged". Ad hoc still shows the "unidentified developer" prompt; the
  # first-run steps are in docs/restore-guide.md.
  identity: "-"
win:
  target: [nsis]
linux:
  target: [AppImage]
