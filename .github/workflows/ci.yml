# Continuous integration (spec 017). REPORT-ONLY until the gate is switched on (task T036).
#
#   quick-checks --> tests-and-coverage --> end-to-end
#        \                                     ^
#         +-----------> build -----------------+
#   pr-size: informational, pull requests only, runs alongside; nothing waits on it.
#   dependency-audit: a real check (no high or critical advisories, shipped or tooling), runs alongside.
#   secret-scan: informational, runs alongside, never blocks yet.
#
# Report-only means: every job runs and shows red or green, and coverage is measured, but branch protection
# does not require any of it yet and the 90% coverage threshold is not enforced (config/coverage.ts).
# Third-party actions are pinned to a full commit SHA; the comment names the release (looked up 2026-11-14).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only. No job uses secrets. Never use pull_request_target here.
permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Formatting
        run: pnpm format:check
      - name: Lint (errors fail; warnings are reported)
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Script tests
        run: pnpm test:scripts
      - name: Migrations match the schema
        run: pnpm check:migrations
      - name: PR title format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ci/check-pr-title.mjs

  # Informational: shows red over 800 lines as a warning, but no job waits on it and branch protection does
  # not require it, so a large PR still gets its tests, build and end-to-end run (owner decision 2026-11-15).
  pr-size:
    name: PR size (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the size is measured against the base branch
          persist-credentials: false
      - name: PR size (red over 800 changed lines unless labelled "mechanical")
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_SIZE_FAIL_OVER: "800"
          PR_SIZE_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'mechanical') }}
        run: bash scripts/pr-size.sh "origin/$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"

  tests-and-coverage:
    name: Tests and coverage
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Unit and integration tests with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('packages/core/coverage/coverage-summary.json') != '' && hashFiles('apps/desktop/coverage/coverage-summary.json') != '' }}
        run: >-
          node scripts/ci/coverage-summary.mjs
          --package core=packages/core/coverage/coverage-summary.json
          --package desktop=apps/desktop/coverage/coverage-summary.json
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            packages/core/coverage
            apps/desktop/coverage
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build the app bundle
        run: pnpm build
      - name: Upload the build for the end-to-end job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: apps/desktop/out
          retention-days: 7
          if-no-files-found: error

  end-to-end:
    name: End-to-end
    needs: [tests-and-coverage, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Unverified: Electron may need Chromium's sandbox off on this runner (open item O1). Harmless in CI.
      SHOPOS_E2E_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: apps/desktop/out
      # Unverified: whether xvfb is already on the runner image (open item O1); installing is idempotent.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the end-to-end tests under a virtual display
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: List tests that passed only on retry
        if: ${{ !cancelled() && hashFiles('apps/desktop/test-results/results.json') != '' }}
        run: node scripts/ci/flaky-summary.mjs apps/desktop/test-results/results.json
      - name: Upload Playwright report, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 14
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A new advisory can turn this red without any code change. Fix it by upgrading the package, or record a
    # reviewed exception in the PR; do not silence the job (spec 017 research F8, open item O4).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Production dependencies (high severity and above)
        run: pnpm audit --prod --audit-level high
      - name: All dependencies including tooling (high severity and above)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high

  secret-scan:
    name: Secret scan (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # not required yet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Chosen over gitleaks-action, which needs a licence key for organisation accounts. The action reads the
      # commit range from the event itself. Unverified: that the image tag below equals the version number.
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          version: "3.99.9"
          extra_args: --results=verified,unknown
